<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <h1>My Personal Website</h1>
        <p>Welcome to my Personal Student Portal</p>
    </header>

    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a class="active" href="registrationform.html">Registration</a></li>
            <li><a href="grades.html">Grades</a></li>
            <li><a href="myinformation.html">Profile</a></li>
        </ul>
    </nav>

    <main class="page-content">
        <section class="form-container">
            <h2>Student Registration Form</h2>
            <form id="registrationForm">
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" placeholder="Enter Name" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter Email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>

                <label>Gender</label>
                <div class="choice-group">
                    <label><input type="radio" name="gender" value="Male" required> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                </div>

                <label for="course">Course</label>
                <select id="course" required>
                    <option value="">Select Course</option>
                    <option>BSIT</option>
                    <option>BSCS</option>
                    <option>BSIS</option>
                </select>

                <label>Skills</label>
                <div class="choice-group">
                    <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
                    <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
                    <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
                </div>

                <label for="profilePicture">Profile Picture</label>
                <input type="file" id="profilePicture" accept="image/*">

                <label for="address">Address</label>
                <textarea id="address" rows="5" placeholder="Enter Address" required></textarea>

                <button type="submit" class="primary-btn">Submit Registration</button>
            </form>
            <p id="formMessage" class="form-message"></p>
        </section>
    </main>

    <footer>
        <p>&copy; <span class="current-year"></span> My Personal Website</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
