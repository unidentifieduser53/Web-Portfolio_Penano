
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Information</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

    <img id="studentImage" src="Images/student.jpg" alt="Student">

    <h1 id="studentName">
        Dwightyyyyy 
    </h1>

    <p id="course">
        Bachelor of Science in Information Technology
    </p>

    <input type="text" id="nameInput" placeholder="Type your nickname">

    <select id="yearSelect">

        <option value="">Select Year</option>

        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>

    </select>

<div class="buttons">

    <button id="clickBtn">Click</button>

    <button id="dblClickBtn">Double Click</button>

    <button id="changeImageBtn">Change Image</button>

    <button id="pressBtn">Press & Hold</button>

</div>

    <p id="status">
        Waiting Magalaw🤣...
    </p>

</div>

<script src="script.js"></script>

</body>

</html>
